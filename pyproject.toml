[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bantengpanel"
version = "1.0.0"
description = "Reproducible population-aware SNP panel evaluation for Bali cattle"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "threadpoolctl>=3,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "playwright>=1.49,<2", "reportlab>=4,<5", "matplotlib>=3.9,<4"]

[project.scripts]
bantengpanel = "bantengpanel.cli:main"

[tool.setuptools.packages.find]
include = ["bantengpanel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
